<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 班级多媒体任务看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f4f0;
    background-image:
      radial-gradient(600px 400px at 15% 10%, rgba(217, 119, 6, .09), transparent 60%),
      radial-gradient(700px 500px at 85% 90%, rgba(180, 83, 9, .06), transparent 60%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 42px 40px; width: 380px; max-width: 92vw;
    border: 1px solid #e8e5df; box-shadow: 0 24px 60px rgba(41, 37, 36, .1);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(217, 119, 6, .35);
  }
  h1 { font-size: 20px; color: #1c1917; text-align: center; font-weight: 600; }
  .sub { text-align: center; color: #a8a29e; font-size: 13px; margin-bottom: 30px; letter-spacing: .05em; }
  label { display: block; font-size: 13px; color: #78716c; font-weight: 500; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; font-size: 16px; border: 1.5px solid #ddd9d2;
    border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s;
    font-family: inherit; color: #292524;
  }
  input:focus { border-color: #b45309; box-shadow: 0 0 0 3px rgba(180, 83, 9, .12); }
  button {
    width: 100%; margin-top: 26px; padding: 12px; font-size: 16px; font-weight: 600;
    color: #fff; background: #b45309; border: none; border-radius: 8px; cursor: pointer;
    transition: background .15s, transform .1s; font-family: inherit; letter-spacing: .15em;
  }
  button:hover { background: #92400e; }
  button:active { transform: translateY(1px); }
  button:disabled { background: #a8a29e; cursor: wait; }
  .err { color: #e03131; font-size: 13px; margin-top: 14px; text-align: center; min-height: 20px; }
  @media (max-width: 480px) {
    .card { padding: 30px 24px; border-radius: 12px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">看</span><h1>班级多媒体任务看板</h1></div>
  <div class="sub">教师管理系统</div>
  <form id="form">
    <label>账号</label>
    <input id="username" autocomplete="username" autofocus>
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const d = await r.json();
    if (d.ok) { location.href = '/app.html'; }
    else { err.textContent = d.error || '登录失败'; }
  } catch (ex) {
    err.textContent = '网络错误,请检查服务器连接';
  }
  btn.disabled = false; btn.textContent = '登 录';
});
</script>
</body>
</html>
